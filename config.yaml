# config.yaml
models:
  teacher:
    name: "Qwen/Qwen2.5-Coder-7B-Instruct"
    max_seq_length: 512
  student:
    name: "Qwen/Qwen2.5-Coder-3B-Instruct"
    max_seq_length: 512
    quant:
      use_4bit: false
    lora:
      r: 16
      alpha: 16
      dropout: 0

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  max_steps: 500
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 10
  weight_decay: 0.01
  warmup_ratio: 0.1
  fp16: false
  bf16: true
  gradient_checkpointing: true
  seed: 3407
  report_to: "none"
  loss_alpha: 0.5
  temperature: 2.0